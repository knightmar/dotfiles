# ~/.config/hypr/hyprlock.conf

$base      = rgb(15173d)
$accent    = rgb(982598)
$lowlight  = rgb(e491c9)
$text      = rgb(f1e9e9)

$Scripts = $HOME/.config/hypr/scripts

general {
    disable_loading_bar = true
    hide_cursor = true

    grace = 0

    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =

    path = $HOME/Pictures/wallpapers/aesthetic-green-anime-ls.png
    color = $base

    blur_passes = 2

    brightness = 0.5
    contrast = 1.0

    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

input-field {

    monitor =

    size = 250,50

    position = 0,-100

    halign = center
    valign = center

    rounding = 20

    outline_thickness = 3

    outer_color = $accent
    inner_color = $base

    font_color = $text

    hide_input = false

    fade_on_empty = true

    placeholder_text = <span foreground="##f1e9e9">🔒 Password...</span>

    dots_center = true
    dots_spacing = 0.5
    dots_size = 0.2

    check_color = $lowlight
    fail_color = rgb(ff3333)
}

label {

    monitor =

    text = $TIME

    color = $text

    font_family = JetBrainsMono Nerd Font Bold
    font_size = 90

    position = 0,150

    halign = center
    valign = center
}

label {

    monitor =

    text = cmd[update:43200000] echo "$(date +"%A, %d %B")"

    color = $lowlight

    font_family = JetBrainsMono Nerd Font
    font_size = 18

    position = 0,70

    halign = center
    valign = center
}

label {

    monitor =

    text = cmd[update:60000] echo "System Online: $($Scripts/Uptimehm.sh)"

    color = $accent

    font_family = JetBrainsMono Nerd Font
    font_size = 10

    position = 0,20

    halign = center
    valign = bottom
}
