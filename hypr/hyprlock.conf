# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

# Définition des couleurs basées sur ton colors.conf
$base     = rgb(15173d)
$accent   = rgb(982598)
$lowlight = rgb(e491c9)
$text     = rgb(f1e9e9)

general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = $HOME/Pictures/wallpapers/aesthetic-green-anime-ls.png # Assure-toi que l'image s'accorde avec le violet/bleu
    color = $base
    
    # Un léger flou rend le style plus "Premium/Simpliste"
    blur_passes = 2 
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# Champ de saisie (Input Field)
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    
    outer_color = $accent
    inner_color = $base
    font_color = $text
    
    fade_on_empty = true
    placeholder_text = <span foreground="##f1e9e9">🔒 Password...</span>
    hide_input = false
    rounding = 20 # Arrondi plus moderne
    
    check_color = $lowlight
    fail_color = rgb(ff3333)
    
    position = 0, -100
    halign = center
    valign = center
}

# Heure (Time)
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 90
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B")"
    color = $lowlight
    font_size = 18
    font_family = JetBrains Mono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# Uptime (Plus discret, en bas)
label {
    monitor =
    text = cmd[update:60000] echo "System Online: $($Scripts/Uptimehm.sh)"
    color = $accent
    font_size = 10
    font_family = JetBrains Mono Nerd Font
    position = 0, 20
    halign = center
    valign = bottom
}
